# Typecheck + production build gate. Runs on PRs and on pushes to the default
# branch, alongside (not instead of) the Vercel deploy workflow.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Client: tsc --noEmit + vite build. Server: prisma generate + tsc --noEmit.
      - name: Build (typecheck client + server, bundle client)
        run: npm run build

      # The consent-bypassing QA hooks must never ship in a production bundle.
      - name: Assert QA test hooks are tree-shaken out
        run: |
          if grep -q 'autoAcceptPairs\|acceptDuo\|syncPresence' client/dist/assets/*.js; then
            echo "::error::QA test hooks leaked into the production bundle (VITE_QA_HOOKS)"
            exit 1
          fi

      # Threshold is `critical` so the gate is green today and still catches the
      # next critical. Known residual highs (Prisma CLI -> @prisma/config ->
      # deepmerge-ts) have no in-range fix; see QUALITY_LEDGER.md.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
